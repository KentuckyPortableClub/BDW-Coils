<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KY Mapping Rep GIS Workbench</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.1.0/turf.min.js" integrity="sha384-V2sTNoSKrI8N2u8kNbpZ2kJh54vI+OABRWz1t5/4m+fJuVeIoIkmILoRhQ/XRqrS" crossorigin="anonymous"></script>
<!--
  KY Mapping Rep GIS Workbench  ("ArcGIS Pro lite")
  Unlisted page on BDW-Coils. NOT linked from index.html. Public URL = not secret.
  Layer list comes from ky-gis-layers.json (same folder, copy of the handoff layers.json).
  Rules: official sources only for outlines; OSM is basemap only; ky-kpc-drawn is NOT evidence;
  parcels approximate, no private owner names; never the Grant County NM parcel service.
-->
<style>
:root{--ink:#171717;--paper:#fbf8f1;--line:#d8cdb2;--gold:#d5a63a;--green:#1d5a3a;--muted:#68635a;--bad:#a3271b;--ok:#1d6b3a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px/1.35 Arial,Helvetica,sans-serif;color:var(--ink);background:#e9e4d6}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--ink);color:#fff;flex-wrap:wrap;z-index:1001}
header h1{font:700 15px Georgia,serif;margin:0 6px 0 2px;white-space:nowrap}
header h1 small{font:900 10px Arial;letter-spacing:1px;color:var(--gold);margin-left:6px}
.tb{display:flex;gap:4px;flex-wrap:wrap}
.tb button,.btn{min-height:32px;padding:5px 9px;border:1.5px solid #fff3;border-radius:7px;background:#2a2a2a;color:#fff;font:900 11px Arial;letter-spacing:.6px;cursor:pointer;white-space:nowrap}
.tb button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.srch{display:flex;gap:4px;flex:1 1 220px;min-width:180px;position:relative}
.srch input{flex:1;min-width:0;padding:6px 8px;border-radius:7px;border:0;font-size:14px}
#sugg{position:absolute;top:100%;left:0;right:0;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 24px #0004;max-height:50vh;overflow:auto;display:none;z-index:2000}
#sugg button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;border-bottom:1px solid #eee;background:#fff;cursor:pointer;font-size:14px}
#sugg button:hover{background:#f6efdc}
#sugg b{font:900 11px Arial;color:var(--green);margin-right:6px}
main{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0}
.panel{position:absolute;top:8px;bottom:8px;width:330px;max-width:calc(100% - 16px);background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0003;z-index:1000;display:flex;flex-direction:column;overflow:hidden}
.panel.hide{display:none}
#layersP{left:8px}
#resP{right:8px}
.ph{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);background:#f3ecdb}
.ph b{font:900 11px Arial;letter-spacing:1.3px}
.ph button{border:0;background:none;font-size:18px;cursor:pointer;line-height:1}
.pb{overflow:auto;padding:6px 10px 12px;flex:1;min-height:0}
.grp{font:900 10px Arial;letter-spacing:1.3px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase}
.lyr{border-bottom:1px dashed #e3d9c2;padding:5px 0}
.lyr label{display:flex;gap:7px;align-items:flex-start;cursor:pointer}
.lyr input[type=checkbox]{margin-top:2px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-top:2px;flex:0 0 auto;border:1px solid #0003}
.lyr .t{flex:1}
.lyr .st{font:900 9.5px Arial;letter-spacing:.5px;margin-left:4px}
.st.load{color:#9a7b16}.st.ok{color:var(--ok)}.st.err{color:var(--bad)}
.lyr .op{display:none;align-items:center;gap:6px;margin:4px 0 0 19px;font-size:11px;color:var(--muted)}
.lyr.on .op{display:flex}
.lyr .op input{flex:1}
.warn{font-size:11px;color:var(--bad);font-weight:700}
.note{font-size:12px;color:var(--muted);margin:6px 0}
.card{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 9px;margin:8px 0}
.card h3{margin:0 0 2px;font:700 15px Georgia,serif}
.card .src{font:900 10px Arial;letter-spacing:.8px;color:var(--green);text-transform:uppercase}
.card table{width:100%;border-collapse:collapse;margin-top:5px;font-size:12px}
.card td{padding:2px 4px;border-top:1px solid #f0ead9;vertical-align:top;word-break:break-word}
.card td:first-child{color:var(--muted);width:42%}
.card .acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.btn2{padding:5px 8px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;font:900 10.5px Arial;letter-spacing:.5px;cursor:pointer;color:var(--ink);text-decoration:none}
.btn2.g{background:var(--gold);border-color:var(--gold)}
.big{font:700 18px Georgia,serif}
.in{color:var(--ok);font-weight:900}.out{color:var(--bad);font-weight:900}
details summary{cursor:pointer;font-size:11px;color:var(--muted);margin-top:4px}
#hud{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;z-index:1000;background:var(--ink);color:#fff;border-radius:10px;padding:8px 10px;box-shadow:0 8px 20px #0005;display:none;max-width:calc(100% - 16px)}
#hud .v{font:700 17px Georgia,serif;margin-bottom:6px}
#hud .row{display:flex;gap:4px;flex-wrap:wrap}
#hud .btn2{background:#fff}
#credits{position:absolute;left:0;right:0;bottom:0;z-index:999;background:#171717e6;color:#eee;font-size:10.5px;padding:4px 8px;display:flex;gap:8px;align-items:center}
#credits span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#credits button{background:none;border:1px solid #fff6;color:#fff;border-radius:5px;font:900 10px Arial;padding:2px 6px;cursor:pointer}
.leaflet-bottom{bottom:22px}
#modal{position:fixed;inset:0;background:#0007;z-index:3000;display:none;align-items:center;justify-content:center;padding:12px}
#modal .box{background:var(--paper);border-radius:12px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:14px 16px}
#modal h2{font:700 19px Georgia,serif;margin:4px 0 8px}
#modal li{margin:4px 0}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 12px;border-radius:8px;z-index:4000;display:none;font-size:13px}
.vx{width:12px!important;height:12px!important;margin:-6px 0 0 -6px!important;border-radius:50%;background:#fff;border:2.5px solid #d1006b;cursor:move}
#updDot{display:none;margin-left:5px;background:#e53935;color:#fff;border-radius:9px;padding:1px 6px;font-size:10px}
#updDot.on{display:inline-block}
.tb button.helpb{background:#fff;color:var(--ink);border-color:#fff}
.upd-sec{font:900 10.5px Arial;letter-spacing:1.2px;color:var(--muted);margin:14px 0 4px;text-transform:uppercase}
.upd-row{display:flex;gap:6px;align-items:baseline;padding:5px 0;border-bottom:1px dashed #e3d9c2;font-size:12.5px}
.upd-row .n{flex:1;min-width:0}
.upd-row .v{white-space:nowrap;text-align:right;font-size:11.5px;color:var(--muted)}
.badge{display:inline-block;font:900 9.5px Arial;letter-spacing:.5px;border-radius:5px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.b-new{background:#e53935;color:#fff}.b-chg{background:var(--gold);color:var(--ink)}.b-rel{background:#dff0e4;color:var(--green)}.b-bad{background:#fbe3e0;color:var(--bad)}
.sub{margin:4px 0 6px 10px}
#modal .box.help{max-width:760px}
.help h3{font:700 16px Georgia,serif;margin:18px 0 6px;border-top:1px solid var(--line);padding-top:12px}
.help ol,.help ul{padding-left:20px;margin:6px 0}
.help li{margin:5px 0}
.help .toc{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px}
.help .toc a{font:900 10.5px Arial;letter-spacing:.5px;border:1.5px solid var(--ink);border-radius:6px;padding:4px 7px;color:var(--ink);text-decoration:none}
.help kbd{font:900 10.5px Arial;background:var(--ink);color:#fff;border-radius:4px;padding:1px 5px;letter-spacing:.4px}
.help .tip{background:#f6efdc;border-left:4px solid var(--gold);padding:7px 9px;border-radius:6px;font-size:13px;margin:8px 0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #2a6fdb;outline-offset:2px}
.potapop{font-size:13px;min-width:200px}
.potapop b{font:700 14px Georgia,serif;display:block}
.potapop .acts{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.potapop .btn2{text-align:center}
@media (max-width:720px){
  header h1 small{display:none}
  .tb{flex-wrap:nowrap;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tb::-webkit-scrollbar{display:none}
  .panel{top:auto;bottom:24px;left:6px!important;right:6px!important;width:auto;max-width:none;max-height:55%}
  #hud{bottom:30px}
}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>KY GIS Workbench<small>MAPPING REP · RESEARCH HELPER</small></h1>
  <div class="tb" id="tools">
    <button data-p="layers" title="Layer list">LAYERS</button>
    <button data-m="identify" class="on" title="Click the map to see what's there">IDENTIFY</button>
    <button data-m="dist" title="Measure a distance">MEASURE</button>
    <button data-m="area" title="Measure an area in acres">AREA</button>
    <button data-m="sketch" title="Draw a proposed boundary, then export it">SKETCH</button>
    <button data-m="pin" title="Drop a pin, then check it against boundaries">PIN</button>
    <button data-p="updates" id="updB" title="Look for new or changed layers">UPDATES<span id="updDot"></span></button>
    <button data-p="help" class="helpb" title="How to use this map">? HELP</button>
  </div>
  <div class="srch">
    <input id="q" placeholder="POTA ref (US-10172) or park name" autocomplete="off" aria-label="Search POTA parks by reference or name">
    <div id="sugg"></div>
  </div>
</header>
<main>
  <div id="map"></div>
  <div class="panel" id="layersP">
    <div class="ph"><b>LAYERS</b><button data-close="layersP" aria-label="Close layers">×</button></div>
    <div class="pb" id="layerList"><p class="note">Loading layer catalog…</p></div>
  </div>
  <div class="panel hide" id="resP">
    <div class="ph"><b id="resT">RESULTS</b><button data-close="resP" aria-label="Close results">×</button></div>
    <div class="pb" id="res" aria-live="polite"></div>
  </div>
  <div id="hud"><div class="v" id="hudV"></div><div class="row" id="hudB"></div></div>
  <div id="credits"><span id="credT"></span><button id="aboutB">ABOUT / CREDITS</button></div>
</main>
</div>
<div id="modal"><div class="box" id="modalB"></div></div>
<div id="toast"></div>

<script>
(function(){
'use strict';
/* ---------- constants ---------- */
const LAYERS_URL = 'ky-gis-layers.json';
const KY_BBOX = [-89.62, 36.45, -81.92, 39.20];          /* lon/lat */
const BANNED = [/33TOOklri9xpic7U/i, /Grant_County_Interactive_Parcel_Map/i, /08912973707d446eb0e87212ffce1ee4/i];
const ACRE = 4046.8564224;
const COLORS = ['#1f7a3a','#2a6fdb','#8e44ad','#c0392b','#0e8a8a','#b35900','#6b4f2a','#d1006b','#4a6b00','#3b3b98','#a0522d','#00796b','#7b1fa2','#ef6c00','#1565c0','#558b2f','#ad1457','#5d4037','#00838f','#9e9d24'];
const GROUPS = {ky_live_kyl:'Kentucky live GIS (KYL)',ky_live_extra:'Kentucky live — more',federal:'Federal',kpc_curated_geojson:'KPC curated GeoJSON (fast)',ky_reference:'Reference',ky_access:'Access points',ky_trails:'Trails',ky_hydro:'Water',ky_parcels:'Parcels (approximate)'};
const GROUP_ORDER = ['ky_live_kyl','ky_live_extra','federal','kpc_curated_geojson','ky_reference','ky_trails','ky_access','ky_hydro','ky_parcels'];
const DEFAULT_ON = ['kyl_kdfwr_hunting','kyl_state_parks_boundary','ky_counties'];
const PRIVATE_FIELD = /(owner|own_nm|^name$|name2|mail|addr|street|grantee|taxpayer|^city$|^state$|^zip|^account|^deed)/i;  /* parcel layers only (Webster: NAME = owner, ADDRESS1/CITY/STATE/ZIPCODE/ACCOUNT/DEED = owner mailing/account) */
/* a parcel layer = the catalog group, or any service / layer whose name says PVA or parcel (covers layers added from UPDATES) */
const isParcel = cfg => cfg.group === 'ky_parcels' || /pva|parcel/i.test((cfg.rest_url || '') + ' ' + (cfg.title || ''));

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d) => Number(n).toLocaleString('en-US', {maximumFractionDigits: d == null ? 1 : d, minimumFractionDigits: 0});
const toast = (m, ms) => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', ms || 2600); };
const isBanned = u => BANNED.some(r => r.test(u || ''));

/* ---------- map + basemaps (same set as kpc-map-tools.js KPCLayers) ---------- */
const map = L.map('map', {zoomControl: true, preferCanvas: true, doubleClickZoom: true}).fitBounds([[KY_BBOX[1], KY_BBOX[0]], [KY_BBOX[3], KY_BBOX[2]]]);
const esriImg = () => L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom: 19, attribution: 'Imagery © Esri'});
const BASE = {
  'Street': {l: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap (basemap only)'}), c: '© OpenStreetMap contributors (basemap tiles only, never boundary evidence)'},
  'Satellite': {l: esriImg(), c: 'Imagery © Esri'},
  'Satellite + labels': {l: L.layerGroup([esriImg(),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {maxZoom: 19}),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {maxZoom: 19})]), c: 'Imagery & labels © Esri'},
  'USGS Topo': {l: L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}', {maxZoom: 16, attribution: 'USGS The National Map'}), c: 'USGS The National Map'},
  'Terrain (OpenTopoMap)': {l: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {maxZoom: 17, attribution: '© OpenStreetMap, SRTM · OpenTopoMap (CC-BY-SA)'}), c: '© OpenStreetMap, SRTM · OpenTopoMap (CC-BY-SA)'}
};
const HILL = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', {maxZoom: 19, opacity: .45});
let baseName = 'Street';
BASE[baseName].l.addTo(map);
const baseObj = {}; Object.keys(BASE).forEach(k => baseObj[k] = BASE[k].l);
L.control.layers(baseObj, {'Hillshade': HILL}, {position: 'topright', collapsed: true}).addTo(map);
map.on('baselayerchange', e => { baseName = e.name; updateCredits(); });
L.control.scale({imperial: true, metric: true, position: 'bottomleft'}).addTo(map);
map.createPane('overlays'); map.getPane('overlays').style.zIndex = 390;   /* server images under vectors */
const hiLayer = L.featureGroup().addTo(map);       /* identify highlight */
const checkLayer = L.featureGroup().addTo(map);    /* pin-check lines */

/* ---------- ESRI JSON -> GeoJSON ---------- */
function ringCW(r) { let s = 0; for (let i = 0; i < r.length - 1; i++) s += (r[i + 1][0] - r[i][0]) * (r[i + 1][1] + r[i][1]); return s > 0; }
function esriGeom(g) {
  if (!g) return null;
  if (g.x != null) return {type: 'Point', coordinates: [g.x, g.y]};
  if (g.points) return {type: 'MultiPoint', coordinates: g.points};
  if (g.paths) return g.paths.length === 1 ? {type: 'LineString', coordinates: g.paths[0]} : {type: 'MultiLineString', coordinates: g.paths};
  if (g.rings) {
    const outers = [], holes = [];
    g.rings.forEach(r => { if (r.length < 4) return; (ringCW(r) ? outers : holes).push(r); });
    if (!outers.length) { return {type: 'Polygon', coordinates: holes.map(r => r.slice().reverse())}; }
    const polys = outers.map(o => [o.slice().reverse()]);   /* GeoJSON outer = counter-clockwise */
    holes.forEach(h => {
      const pt = h[0];
      const host = polys.find(p => turf.booleanPointInPolygon(pt, turf.polygon([p[0]]))) || polys[0];
      host.push(h.slice().reverse());
    });
    return polys.length === 1 ? {type: 'Polygon', coordinates: polys[0]} : {type: 'MultiPolygon', coordinates: polys};
  }
  return null;
}
async function arcQuery(url, params) {
  const p = new URLSearchParams(Object.assign({where: '1=1', outFields: '*', returnGeometry: 'true', outSR: '4326', inSR: '4326', f: 'json'}, params));
  const out = []; let offset = 0;
  for (let page = 0; page < 6; page++) {            /* follow exceededTransferLimit (services cap at 1000-2000 records) */
    if (offset) p.set('resultOffset', String(offset));
    const r = await fetch(url.replace(/\/$/, '') + '/query?' + p.toString());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (j.error) throw new Error(j.error.message || 'service error');
    const fs = j.features || [];
    fs.forEach(f => out.push({type: 'Feature', properties: f.attributes || {}, geometry: esriGeom(f.geometry)}));
    if (!j.exceededTransferLimit || !fs.length) break;
    offset += fs.length;
  }
  return out;
}

/* ---------- layer state ---------- */
let CAT = null; const LY = {};   /* id -> {cfg, on, opacity, color, obj, data, status} */
const svcOf = u => u.replace(/\/(MapServer|FeatureServer)\/\d+\/?$/, '/$1');
const kind = c => c.geometry === 'GeoJSON' ? 'geojson' : /\/MapServer\/\d+/.test(c.rest_url) ? 'export' : 'vector';

function setStatus(id, s, msg) {
  const L_ = LY[id]; if (!L_) return; L_.status = s;
  const el = document.querySelector(`[data-st="${id}"]`);
  if (el) { el.className = 'st ' + s; el.textContent = s === 'load' ? 'LOADING' : s === 'err' ? 'NOT ANSWERING' : s === 'ok' ? (msg || '') : ''; el.title = msg || ''; }
}

/* server-rendered image of a MapServer layer (handles huge polygons like PAD-US / DBNF) */
function makeExportLayer(st) {
  const c = st.cfg, svc = svcOf(c.rest_url);
  const g = {img: null, seq: 0};
  g.refresh = () => {
    if (!st.on) return;
    const b = map.getBounds(), sz = map.getSize();
    if (!sz.x || !sz.y) return;   /* page opened in a hidden tab: wait for the 'resize' refresh */
    const sw = L.CRS.EPSG3857.project(b.getSouthWest()), ne = L.CRS.EPSG3857.project(b.getNorthEast());
    const p = new URLSearchParams({bbox: [sw.x, sw.y, ne.x, ne.y].join(','), bboxSR: '3857', imageSR: '3857', size: sz.x + ',' + sz.y, dpi: '96', format: 'png32', transparent: 'true', layers: 'show:' + c.layer_id, f: 'image'});
    if (c.id === 'padus_fee') p.set('layerDefs', JSON.stringify({[c.layer_id]: "State_Nm='KY'"}));
    const my = ++g.seq; setStatus(c.id, 'load');
    const ov = L.imageOverlay(svc + '/export?' + p.toString(), b, {opacity: st.opacity, pane: 'overlays', interactive: false});
    ov.once('load', () => { if (my !== g.seq || !st.on) { ov.remove(); return; } if (g.img) g.img.remove(); g.img = ov; setStatus(c.id, 'ok'); });
    ov.once('error', () => { ov.remove(); if (my !== g.seq) return; setStatus(c.id, 'err', 'Map image did not load from ' + svc); });
    ov.addTo(map);
  };
  g.add = () => g.refresh();
  g.remove = () => { g.seq++; if (g.img) { g.img.remove(); g.img = null; } };
  g.opacity = o => { if (g.img) g.img.setOpacity(o); };
  return g;
}
/* hosted FeatureServer (NPS, FWS): fetch the Kentucky-area features once as vectors */
function styleFor(st) {
  const drawn = st.cfg.id === 'kpc_ky_kpc_drawn';
  return {color: st.color, weight: drawn ? 2 : 1.6, opacity: Math.min(1, st.opacity + .25), fillOpacity: st.opacity * 0.35, fillColor: st.color, dashArray: drawn ? '6 6' : null};
}
function makeVectorLayer(st) {
  const g = {lyr: null};
  g.load = async () => {
    if (st.data) return st.data;
    setStatus(st.cfg.id, 'load');
    try {
      let fc;
      if (kind(st.cfg) === 'geojson') {
        const r = await fetch(st.cfg.rest_url); if (!r.ok) throw new Error('HTTP ' + r.status);
        fc = await r.json();
      } else {
        const feats = await arcQuery(st.cfg.rest_url, {geometry: KY_BBOX.join(','), geometryType: 'esriGeometryEnvelope', spatialRel: 'esriSpatialRelIntersects', maxAllowableOffset: '0.0002', geometryPrecision: '6'});
        fc = {type: 'FeatureCollection', features: feats.filter(f => f.geometry)};
      }
      st.data = fc; setStatus(st.cfg.id, 'ok', (fc.features || []).length + ' shapes');
      return fc;

    const j = await r.json();

  ref = ref.replace(/^([A-Z0-9]{1,4})-(\d{1,5})$/, (m, a, n) => a + '-' + n.padStart(4, '0'));   /* US-19 → US-0019 */
  const p = POTA.list.find(x => x.ref === ref);
  if (p) { map.setView([p.lat, p.lng], 14); selectPota(p); return true; }
  fetch('https://api.pota.app/park/' + encodeURIComponent(ref)).then(r => r.ok ? r.json() : null).then(j => {
    if (j && j.latitude) { const q = {ref: j.reference, name: j.name, lat: +j.latitude, lng: +j.longitude}; map.setView([q.lat, q.lng], 14); selectPota(q); }

/* ---------- geometry helpers ---------- */
const polyParts = g => !g ? [] : g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];

const acresOf = g => isPoly(g) ? turf.area({type: 'Feature', geometry: g, properties: {}}) / ACRE : 0;
function edgeInfo(pt, geom) {   /* inside?, miles to nearest edge, nearest point */
  const P = turf.point(pt), f = {type: 'Feature', geometry: geom, properties: {}};
  const inside = turf.booleanPointInPolygon(P, f);
  let best = null;
  polyParts(geom).forEach(rings => rings.forEach(r => {
    const ln = turf.lineString(r), np = turf.nearestPointOnLine(ln, P, {units: 'miles'});
    if (!best || np.properties.dist < best.d) best = {d: np.properties.dist, at: np.geometry.coordinates};
  }));
  return {inside, mi: best ? best.d : null, at: best ? best.at : null};
}

/* ---------- identify ---------- */
function fieldVal(props, name) { if (!name) return null; const k = Object.keys(props).find(x => x.toLowerCase() === String(name).toLowerCase()); return k ? props[k] : null; }
function cleanProps(st, props) {
  const out = {};
  Object.keys(props).forEach(k => {
    if (isParcel(st.cfg) && PRIVATE_FIELD.test(k) && !/parcel/i.test(k)) return;   /* privacy rule: never show private owners */
    const v = props[k]; if (v == null || v === '' || /^(shape|objectid|fid|globalid|shape_(area|length|len)|st_(area|length)\(shape\))/i.test(k)) return;
    out[k] = v;

}
const tolDeg = px => { const c = map.getCenter(), a = map.latLngToContainerPoint(c), b = map.containerPointToLatLng([a.x + px, a.y]); return Math.abs(b.lng - c.lng); };

async function queryLayerAt(st, latlng) {
  const c = st.cfg, pt = [latlng.lng, latlng.lat];
  if (kind(c) === 'export') {
    const params = c.geometry === 'esriGeometryPolygon'
      ? {geometry: JSON.stringify({x: pt[0], y: pt[1], spatialReference: {wkid: 4326}}), geometryType: 'esriGeometryPoint'}
      : (() => { const t = tolDeg(8); return {geometry: [pt[0] - t, pt[1] - t, pt[0] + t, pt[1] + t].join(','), geometryType: 'esriGeometryEnvelope'}; })();
    params.spatialRel = 'esriSpatialRelIntersects'; params.geometryPrecision = '6';
    if (c.id === 'padus_fee') params.where = "State_Nm='KY'";
    const fs = await arcQuery(c.rest_url, params);
    /* a "line" layer that really holds polygons (county lines): keep only the polygon the click is inside */
    return fs.filter(f => !isPoly(f.geometry) || turf.booleanPointInPolygon(turf.point(pt), f));
  }
  const fc = st.data || await st.obj.load();
  const P = turf.point(pt), t = tolDeg(8);
  return (fc.features || []).filter(f => {
    const g = f.geometry; if (!g) return false;
    if (isPoly(g)) return turf.booleanPointInPolygon(P, f);
    if (/Point/.test(g.type)) { const cs = g.type === 'Point' ? [g.coordinates] : g.coordinates; return cs.some(cc => Math.abs(cc[0] - pt[0]) < t && Math.abs(cc[1] - pt[1]) < t); }

/* ---------- results panel ---------- */

/* ---------- pin vs boundaries ---------- */
let lastChecks = [];
async function checkPin() {
  if (!pin) { toast('Tap PIN, then tap the map (or pick a POTA pin) first'); return; }
  checkLayer.clearLayers();
  const vis = Object.values(LY).filter(s => s.on && /Polygon|GeoJSON/.test(s.cfg.geometry));
  const label = (pin.ref ? pin.ref + ' · ' : '') + (pin.name || 'Dropped pin');
  showRes('PIN CHECK', `<p class="note">${esc(label)} · checking ${vis.length} polygon layer(s) within 5 miles…</p>`);
  const pt = [pin.lng, pin.lat], R = 5;   /* miles */
  const dLat = R / 69.0, dLng = R / (69.17 * Math.cos(pin.lat * Math.PI / 180));   /* box that just holds a 5-mile circle */
  const env = [pt[0] - dLng, pt[1] - dLat, pt[0] + dLng, pt[1] + dLat];
  const out = await Promise.all(vis.map(async st => {
    try {
      let fs;
      if (kind(st.cfg) === 'export') {
        const prm = {geometry: env.join(','), geometryType: 'esriGeometryEnvelope', spatialRel: 'esriSpatialRelIntersects', geometryPrecision: '6'};
        if (st.cfg.id === 'padus_fee') prm.where = "State_Nm='KY'";
        fs = await arcQuery(st.cfg.rest_url, prm);
      } else {
        const fc = st.data || await st.obj.load(), box = turf.bboxPolygon(env);
        fs = (fc.features || []).filter(f => isPoly(f.geometry) && !turf.booleanDisjoint(box, f));
      }
      return {st, fs: fs.filter(f => isPoly(f.geometry))};
    } catch (e) { return {st, err: e.message || String(e)}; }
  }));
  if (sketch.done && sketch.pts.length > 2) out.push({st: {cfg: {title: 'Your sketch', credit: 'Drawn in this tool (not official)', id: 'sketch'}, color: '#d1006b'}, fs: [sketchFeature()]});
  lastChecks = [];
  /* keep only shapes the pin is inside, or whose edge is within the 5-mile circle (the query box has corners ~7 mi out) */
  out.forEach(({st, fs}) => (fs || []).forEach(f => { const e = edgeInfo(pt, f.geometry); if (e.inside || (e.mi != null && e.mi <= R)) lastChecks.push({st, f, e}); }));
  lastChecks.sort((a, b) => (b.e.inside - a.e.inside) || (a.e.mi - b.e.mi));
  let h = `<p><b>${esc(label)}</b><br><span class="note">${pin.lat.toFixed(6)}, ${pin.lng.toFixed(6)}</span></p>`;
  out.filter(o => o.err).forEach(o => h += `<p class="warn">${esc(o.st.cfg.title)}: service did not answer (${esc(o.err)})</p>`);
  if (!lastChecks.length) h += '<p class="note">No official polygon from the visible layers within 5 miles. Switch on more layers (PAD-US, USACE, FWS…) and check again.</p>';
  lastChecks.slice(0, 12).forEach((c, i) => {
    const nm = featName(c.st, c.f), ft = c.e.mi * 5280;
    h += `<div class="card"><div class="src" style="color:${c.st.color || '#333'}">${esc(c.st.cfg.title)}</div><h3>${esc(nm)}</h3>
      <div>${c.e.inside ? '<span class="in">INSIDE</span>' : '<span class="out">OUTSIDE</span>'} · ${c.e.inside ? 'edge is' : 'boundary is'} <b>${ft < 2640 ? fmt(ft, 0) + ' ft' : fmt(c.e.mi, 2) + ' mi'}</b> ${c.e.inside ? 'away' : 'from the pin'}</div>
      <div class="note">${fmt(acresOf(c.f.geometry), 1)} acres measured · Source: ${esc(c.st.cfg.credit || '')}</div>
      <div class="acts"><button class="btn2" data-src="chk" data-hit="${i}" data-a="zoom">ZOOM</button></div></div>`;
    if (i < 3 && c.e.at) {
      L.polyline([[pin.lat, pin.lng], [c.e.at[1], c.e.at[0]]], {color: c.e.inside ? '#1d6b3a' : '#a3271b', weight: 2.5, dashArray: '5 5'}).addTo(checkLayer)
        .bindTooltip((c.e.inside ? 'inside · ' : 'outside · ') + (ft < 2640 ? fmt(ft, 0) + ' ft' : fmt(c.e.mi, 2) + ' mi'), {permanent: i === 0});
    }
  });
  h += '<p class="note">Distances are along the ground to the nearest polygon edge. Research helper, not official.</p>';
  showRes('PIN CHECK', h);

}
function pinVsOne(hit) {

  const ft = e.mi * 5280, txt = (e.inside ? 'INSIDE' : 'OUTSIDE') + ' · ' + (ft < 2640 ? fmt(ft, 0) + ' ft' : fmt(e.mi, 2) + ' mi') + ' to edge';
  if (e.at) L.polyline([[pin.lat, pin.lng], [e.at[1], e.at[0]]], {color: e.inside ? '#1d6b3a' : '#a3271b', weight: 2.5, dashArray: '5 5'}).addTo(checkLayer).bindTooltip(txt, {permanent: true});

const safeName = s => String(s || 'shape').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_').slice(0, 60) || 'shape';
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function downloadGeoJSON(geom, name, props) {
  const fc = {type: 'FeatureCollection', features: [{type: 'Feature', properties: Object.assign({name, acres_measured: +acresOf(geom).toFixed(2), exported_by: 'KY GIS Workbench (research helper, not official)', exported: new Date().toISOString().slice(0, 10)}, props || {}), geometry: geom}]};

function downloadKML(geom, name, desc) {
  const ring = r => `<LinearRing><coordinates>${r.map(c => c[0].toFixed(7) + ',' + c[1].toFixed(7) + ',0').join(' ')}</coordinates></LinearRing>`;
  const poly = rings => `<Polygon><outerBoundaryIs>${ring(rings[0])}</outerBoundaryIs>${rings.slice(1).map(h => `<innerBoundaryIs>${ring(h)}</innerBoundaryIs>`).join('')}</Polygon>`;
  const parts = polyParts(geom);
  const g = parts.length === 1 ? poly(parts[0]) : `<MultiGeometry>${parts.map(poly).join('')}</MultiGeometry>`;
  const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${kmlEsc(name)}</name>
<Style id="s"><LineStyle><color>ff6b00d1</color><width>3</width></LineStyle><PolyStyle><color>336b00d1</color></PolyStyle></Style>
<Placemark><name>${kmlEsc(name)}</name><description>${kmlEsc((desc || '') + ' · ' + fmt(acresOf(geom), 2) + ' acres measured · KY GIS Workbench, research helper, not official')}</description><styleUrl>#s</styleUrl>${g}</Placemark>
</Document></kml>`;
  download(safeName(name) + '.kml', kml, 'application/vnd.google-earth.kml+xml');
}

/* ---------- UPDATES: look for new or changed layers ----------
   - Your layers: answering? feature count in the Kentucky box (change since last check), last-edited date where the server tells us
   - New on the KY state server: services that are not in ky-gis-layers.json (NEW = appeared since your last check)
   - KPC GeoJSON copies: file date (Last-Modified)
   Results are kept in this browser (localStorage). A quiet check runs by itself when the last one is over 7 days old. */
const KYSRV = 'https://kygisserver.ky.gov/arcgis/rest/services/WGS84WM_Services';
const RELEVANT = /park|hunt|wma|wildlife|preserve|natural_?area|nature|forest|conserv|recreat|trail|lake|wild_?river|refuge|public_?(land|hunt|access)|boat|fish|heritage|state_?land|dbnf|usfs|nps|camp|easement|elk/i;
const UPD_KEY = 'kygis_upd';
let UPD = (() => { try { return JSON.parse(localStorage.getItem(UPD_KEY) || 'null'); } catch (e) { return null; } })();
const saveUpd = () => { try { localStorage.setItem(UPD_KEY, JSON.stringify(UPD)); } catch (e) {} };
const fmtDate = t => t ? new Date(t).toLocaleDateString('en-US', {year: 'numeric', month: 'short', day: 'numeric'}) : '—';
const daysAgo = t => t ? Math.floor((Date.now() - t) / 864e5) : null;
const svcName = u => (u.match(/services\/(?:WGS84WM_Services\/)?([^/]+)\/(?:MapServer|FeatureServer)/) || [])[1] || '';
async function getJSON(u, ms) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms || 15000);
  try { const r = await fetch(u, {signal: c.signal}); if (!r.ok) throw new Error('HTTP ' + r.status); const j = await r.json(); if (j && j.error) throw new Error(j.error.message || 'service error'); return j; }
  finally { clearTimeout(t); }
}
async function pool(items, n, fn) { const out = []; let i = 0; await Promise.all(Array.from({length: n}, async () => { while (i < items.length) { const k = i++; out[k] = await fn(items[k]); } })); return out; }
function updateDot() {
  const n = UPD && !UPD.seen ? (UPD.result.newSvc.length + UPD.result.changed) : 0;
  const d = $('#updDot'); d.textContent = n; d.classList.toggle('on', n > 0);
}
let updRunning = false;
async function runUpdateCheck(quiet) {
  if (updRunning) return; updRunning = true;
  if (!quiet) showRes('UPDATES', '<p class="note">Checking the agencies’ servers… (about 10–30 seconds)</p>');
  /* compare with the last baseline the user has SEEN, so a change found by a quiet check is not wiped by the next quiet check */
  const prev = UPD ? (UPD.seen || !UPD.ref ? UPD.base : UPD.ref) : null;
  const prevWhen = UPD ? (UPD.seen || !UPD.ref ? UPD.result.when : UPD.refWhen) : null;
  const base = {counts: {}, edits: {}, files: {}, services: []};
  const res = {when: Date.now(), prevWhen, layers: [], newSvc: [], otherSvc: [], files: [], changed: 0, svcErr: null};
  /* 1. catalog layers */
  const arc = CAT.layers.filter(c => kind(c) !== 'geojson');
  res.layers = await pool(arc, 6, async c => {
    const row = {id: c.id, title: c.title, ok: true};
    try {
      const prm = new URLSearchParams({where: c.id === 'padus_fee' ? "State_Nm='KY'" : '1=1', geometry: KY_BBOX.join(','), geometryType: 'esriGeometryEnvelope', inSR: '4326', spatialRel: 'esriSpatialRelIntersects', returnCountOnly: 'true', f: 'json'});
      const [cnt, info] = await Promise.all([getJSON(c.rest_url + '/query?' + prm), getJSON(c.rest_url + '?f=json').catch(() => ({}))]);
      row.count = cnt.count; base.counts[c.id] = cnt.count;
      const ed = info.editingInfo && (info.editingInfo.dataLastEditDate || info.editingInfo.lastEditDate);
      if (ed) { row.edit = ed; base.edits[c.id] = ed; }
      if (c.id === 'padus_fee' && info.name) row.version = info.name.replace(/_?Fee.*$/i, '').replace(/^PADUS/i, 'PAD-US ').replace('_', '.');
      if (prev && prev.counts[c.id] != null && prev.counts[c.id] !== cnt.count) { row.was = prev.counts[c.id]; row.changed = true; }
      if (prev && ed && prev.edits[c.id] && ed > prev.edits[c.id]) row.changed = true;
    } catch (e) { row.ok = false; row.err = e.name === 'AbortError' ? 'timed out' : (e.message || String(e)); }
    if (row.changed) res.changed++;
    return row;
  });
  /* 2. KPC GeoJSON file dates */
  res.files = await pool(CAT.layers.filter(c => kind(c) === 'geojson'), 6, async c => {
    const row = {id: c.id, title: c.title};
    try { const r = await fetch(c.rest_url, {method: 'HEAD', cache: 'no-store'}); row.ok = r.ok; const lm = r.headers.get('last-modified'); if (lm) { row.date = Date.parse(lm); base.files[c.id] = row.date; if (prev && prev.files[c.id] && row.date > prev.files[c.id]) { row.changed = true; res.changed++; } } }
    catch (e) { row.ok = false; }
    return row;
  });
  /* 3. services on the KY state server that are not in the catalog */
  try {
    const j = await getJSON(KYSRV + '?f=json');
    const have = new Set(CAT.layers.map(c => svcName(c.rest_url)).filter(Boolean));
    const names = [...new Set((j.services || []).map(s => s.name.split('/').pop()))].sort();
    base.services = names;
    const seenBefore = prev ? new Set(prev.services) : null;
    names.filter(n => !have.has(n) && !isBanned(n)).forEach(n => {
      const types = (j.services || []).filter(s => s.name.split('/').pop() === n).map(s => s.type);
      const item = {name: n, type: types.includes('MapServer') ? 'MapServer' : types[0], rel: RELEVANT.test(n), isNew: !!(seenBefore && seenBefore.size && !seenBefore.has(n))};
      (item.isNew ? res.newSvc : res.otherSvc).push(item);
    });
    res.otherSvc.sort((a, b) => (b.rel - a.rel) || a.name.localeCompare(b.name));
    res.gone = prev ? prev.services.filter(n => !names.includes(n)) : [];
  } catch (e) { res.svcErr = e.message || String(e); }
  UPD = {base, ref: prev, refWhen: prevWhen, result: res, seen: false}; saveUpd();
  updRunning = false; updateDot();
  if (!quiet || !$('#resP').classList.contains('hide') && $('#resT').textContent.startsWith('UPDATES')) renderUpdates();
}
const prettySvc = n => n.replace(/^Ky_/, '').replace(/_WGS84WM$/, '').replace(/_/g, ' ');
function renderUpdates() {
  if (!UPD) { showRes('UPDATES', '<p class="note">No check yet.</p><button class="btn2 g" data-u="run">CHECK NOW</button>'); return; }
  const r = UPD.result; UPD.seen = true; saveUpd(); updateDot();
  let h = `<p><b>Checked ${fmtDate(r.when)}</b>${r.prevWhen ? ` · compared with your check on ${fmtDate(r.prevWhen)}` : ' · first check, so this one sets the baseline. Changes show from the next check on.'}</p>
    <div class="acts" style="display:flex;gap:4px;flex-wrap:wrap"><button class="btn2 g" data-u="run">CHECK AGAIN</button><button class="btn2" data-u="help">WHAT DOES THIS MEAN?</button></div>`;
  const nNew = r.newSvc.length, nBad = r.layers.filter(l => !l.ok).length;
  h += `<div class="card"><b>${r.changed ? r.changed + ' layer' + (r.changed === 1 ? '' : 's') + ' changed' : 'No changes to your layers'}</b> · ${nNew ? nNew + ' new on the KY server' : 'nothing new on the KY server'}${nBad ? ` · <span class="out">${nBad} not answering</span>` : ''}</div>`;
  /* new services */
  if (r.svcErr) h += `<p class="warn">Could not read the KY GIS service list: ${esc(r.svcErr)}</p>`;
  if (nNew) { h += `<div class="upd-sec">New on the Kentucky GIS server</div>`; r.newSvc.forEach(s => h += svcRow(s)); }
  if (r.gone && r.gone.length) h += `<div class="upd-sec">Removed from the KY server since last check</div>` + r.gone.map(n => `<div class="upd-row"><span class="n">${esc(prettySvc(n))}<span class="badge b-bad">GONE</span></span></div>`).join('');
  /* your layers */
  h += `<div class="upd-sec">Your layers</div>`;
  r.layers.forEach(l => {
    const v = !l.ok ? `<span class="out">not answering</span>` : `${l.count != null ? fmt(l.count, 0) + (l.count === 1 ? ' shape' : ' shapes') : ''}${l.was != null ? ` (was ${fmt(l.was, 0)})` : ''}${l.edit ? `<br>edited ${fmtDate(l.edit)}` : ''}${l.version ? `<br>${esc(l.version)}` : ''}`;
    h += `<div class="upd-row"><span class="n">${esc(l.title)}${l.changed ? '<span class="badge b-chg">CHANGED</span>' : ''}${l.edit && daysAgo(l.edit) <= 30 ? '<span class="badge b-chg">EDITED ≤30 DAYS</span>' : ''}</span><span class="v">${v}</span></div>`;
  });
  h += `<div class="upd-sec">KPC GeoJSON copies (file date)</div>`;
  r.files.forEach(f => h += `<div class="upd-row"><span class="n">${esc(f.title)}${f.changed ? '<span class="badge b-chg">UPDATED</span>' : ''}</span><span class="v">${f.ok === false ? '<span class="out">missing</span>' : fmtDate(f.date)}</span></div>`);
  /* everything else on the server */
  const rel = r.otherSvc.filter(s => s.rel), rest = r.otherSvc.filter(s => !s.rel);
  h += `<div class="upd-sec">On the KY server, not in your list (${r.otherSvc.length})</div><p class="note">Green = name looks park / land related. Tap SHOW LAYERS, then ADD TO MAP to try one for this visit.</p>`;
  rel.forEach(s => h += svcRow(s));
  if (rest.length) h += `<details><summary>${rest.length} more (roads, imagery, utilities…)</summary>${rest.map(svcRow).join('')}</details>`;
  h += `<p class="note">Layers you add here last for this visit only. To keep one, tap COPY CATALOG ENTRY and paste it into <code>ky-gis-layers.json</code> in the BDW-Coils repo.</p>`;
  showRes('UPDATES', h);
}
const svcRow = s => `<div class="upd-row" data-svc="${esc(s.name)}" data-type="${esc(s.type)}"><span class="n">${esc(prettySvc(s.name))}${s.isNew ? '<span class="badge b-new">NEW</span>' : ''}${s.rel ? '<span class="badge b-rel">PARK / LAND?</span>' : ''}<div class="sub"></div></span><span class="v"><button class="btn2" data-u="sub">SHOW LAYERS</button></span></div>`;
function openUpdates() {
  if (innerWidth <= 720) $('#layersP').classList.add('hide');
  if (UPD) renderUpdates(); else runUpdateCheck(false);
}
const sessionCfg = {};
$('#res').addEventListener('click', async e => {
  const b = e.target.closest('[data-u]'); if (!b) return;
  const a = b.dataset.u;
  if (a === 'run') { runUpdateCheck(false); return; }
  if (a === 'help') { help('updates'); return; }
  const row = b.closest('[data-svc]');
  if (a === 'sub') {
    const box = row.querySelector('.sub'); box.innerHTML = '<span class="note">loading…</span>';
    try {
      const url = `${KYSRV}/${row.dataset.svc}/${row.dataset.type}`;
      const j = await getJSON(url + '?f=json');
      const lys = (j.layers || []).filter(l => !l.subLayerIds || !l.subLayerIds.length);
      box.innerHTML = (j.serviceDescription || j.description ? `<div class="note">${esc(String(j.serviceDescription || j.description).replace(/<[^>]+>/g, ' ').slice(0, 220))}…</div>` : '') +
        (lys.length ? lys.map(l => `<div style="margin:3px 0">${esc(l.name)} <span class="note">(${esc((l.geometryType || '').replace('esriGeometry', '') || 'table')})</span><br>
          ${l.geometryType ? `<button class="btn2 g" data-u="add" data-url="${esc(url + '/' + l.id)}">ADD TO MAP</button> <button class="btn2" data-u="copy" data-url="${esc(url + '/' + l.id)}">COPY CATALOG ENTRY</button>` : ''}</div>`).join('') : '<span class="note">No map layers in this service.</span>');
    } catch (err) { box.innerHTML = `<span class="warn">Did not answer: ${esc(err.message || err)}</span>`; }
    return;
  }
  if (a === 'add' || a === 'copy') {
    const url = b.dataset.url;
    let c = sessionCfg[url];
    if (!c) {
      try {
        const info = await getJSON(url + '?f=json'), svc = await getJSON(svcOf(url) + '?f=json').catch(() => ({}));
        const svcPretty = prettySvc(row.dataset.svc), lyrPretty = String(info.name || '').replace(/^Ky_/, '').replace(/_WGS84WM$/, '').replace(/_/g, ' ');
        const id = 'sess_' + row.dataset.svc.replace(/^Ky_/i, '').replace(/_WGS84WM$/i, '').toLowerCase().replace(/\W+/g, '_') + '_' + info.id;   /* e.g. sess_elk_regulated_areas_0 */
        c = sessionCfg[url] = {id, group: 'session', title: lyrPretty.toLowerCase() === svcPretty.toLowerCase() ? lyrPretty : lyrPretty + ' (' + svcPretty + ')', what: String(info.description || '').replace(/<[^>]+>/g, ' ').slice(0, 300),
          rest_url: url, query_url: url + '/query', layer_id: info.id, name_field: info.displayField || null, display_field: info.displayField || null,
          useful_fields: (info.fields || []).filter(f => !/^(objectid|shape|globalid|fid)/i.test(f.name)).slice(0, 8).map(f => f.name),
          agency: svc.copyrightText || 'Kentucky state GIS', credit: svc.copyrightText || 'Kentucky state GIS (kygisserver.ky.gov)', licence_note: 'Kentucky state GIS. Confirm terms on kygisserver.ky.gov.',
          geometry: info.geometryType, mvp: false, verified: new Date().toISOString().slice(0, 10)};
      } catch (err) { toast('That layer did not answer'); return; }
    }
    if (a === 'copy') { const o = Object.assign({}, c); o.id = o.id.replace(/^sess_/, 'ky_'); o.group = isParcel(c) ? 'ky_parcels' : 'ky_live_extra'; copyText(JSON.stringify(o, null, 2) + ',', b); return; }
    if (!LY[c.id]) {
      const st = registerLayer(c);
      const g = $('#sessGrp'); if (!g.innerHTML) g.innerHTML = '<div class="grp">Added this visit</div>';
      g.insertAdjacentHTML('beforeend', layerRow(st));
    }
    document.querySelector(`[data-l="${c.id}"]`).checked = true; toggleLayer(c.id, true);
    b.textContent = 'ON MAP ✓'; toast('Added. It is in LAYERS under “Added this visit”.');
  }
});

/* ---------- HELP (how-to page) ---------- */
function help(section) {
  $('#modalB').className = 'box help';
  $('#modalB').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><h2>How to use the KY GIS Workbench</h2><button class="btn2 g" data-close-m>CLOSE</button></div>
  <p>This is one map with official Kentucky and federal public-land layers. Use it to research POTA parks: see what land is where, measure it, sketch a proposed boundary, and check whether a pin is inside the park.</p>
  <div class="toc">${[['start', 'Quick start'], ['layers', 'Layers'], ['identify', 'Identify'], ['measure', 'Measure & area'], ['sketch', 'Sketch & export'], ['pin', 'Pin check'], ['search', 'Search'], ['updates', 'Updates'], ['phone', 'On a phone'], ['rules', 'Good to know']].map(([k, t]) => `<a href="#h-${k}" data-jump="${k}">${t}</a>`).join('')}</div>

  <h3 id="h-start">Quick start</h3>
  <ol><li>Type a POTA ref (like <b>US-10172</b>) or a park name in the search box and pick it. The map zooms to the park.</li>
  <li>Tap <kbd>LAYERS</kbd> and switch on what you need, for example <i>KDFWR Public Hunting Areas</i>, <i>State Park Boundaries</i> or <i>PAD-US</i>.</li>
  <li>With <kbd>IDENTIFY</kbd> on (gold), tap the map. The right-hand panel lists every outline under that spot, with its name, owner and measured acres.</li>
  <li>Tap the pink POTA pin, then <b>CHECK PIN VS BOUNDARIES</b>, to see whether the pin is inside the official outline.</li></ol>
  <div class="tip">The gold button in the top bar is the tool that is on. Tap it again to go back to IDENTIFY.</div>

  <h3 id="h-layers">Layers</h3>
  <ul><li><b>Kentucky live GIS:</b> comes straight from the state server every time, so it is the newest data. Use it first for state land (WMAs, state parks, nature preserves, state forests).</li>
  <li><b>Federal:</b> PAD-US (the national public-land database, updated every year or two), plus National Park Service, Fish & Wildlife and Forest Service land.</li>
  <li><b>KPC curated GeoJSON:</b> the club’s saved copies, the same outlines Park Commander shows. They load fast.</li>
  <li>The slider under a switched-on layer changes how see-through it is. A <i>striped</i> swatch means the agency’s server draws the layer in its own colours. A <i>solid</i> swatch is the colour this map uses for that layer.</li>
  <li><b>LOADING</b> / a count / <b>NOT ANSWERING</b> next to a layer tells you whether its server responded. Servers go down sometimes, so try again later.</li>
  <li>Change the background (Street, Satellite, USGS Topo…) with the stacked-squares button at the top right of the map.</li></ul>

  <h3 id="h-identify">Identify</h3>
  <ul><li>Tap anywhere. Each card shows the layer it came from, the name, the key fields, and the acres <i>measured from the shape the server returned</i>. Tap <i>more fields</i> to see everything.</li>
  <li>Buttons on each card: <b>ZOOM</b> fits the shape on screen. <b>EDIT AS SKETCH</b> copies the outline so you can change it. <b>GEOJSON</b> / <b>KML</b> download the outline. <b>PIN VS THIS</b> measures your pin against this one shape.</li>
  <li>Only layers that are switched on get asked.</li></ul>

  <h3 id="h-measure">Measure & area</h3>
  <ul><li><kbd>MEASURE</kbd>: tap points along a route. The bar at the bottom shows miles, km and feet.</li>
  <li><kbd>AREA</kbd>: tap the corners of a shape. It shows acres, square miles and hectares as you go.</li>
  <li><b>UNDO</b> removes the last point, <b>CLEAR</b> starts over, and <b>DONE</b> goes back to Identify.</li></ul>

  <h3 id="h-sketch">Sketch a boundary & export</h3>
  <ol><li>Tap <kbd>SKETCH</kbd>, then tap each corner of the proposed boundary. Live acres show at the bottom.</li>
  <li>Tap <b>FINISH</b>. Drag any pink corner to adjust it. On a computer, Shift-click a corner to delete it. <b>ADD CORNERS</b> lets you keep drawing.</li>
  <li><b>NAME</b> it, then <b>GEOJSON</b> or <b>KML</b> to download it. KML opens in Google Earth, and GeoJSON opens on geojson.io. <b>COPY GEOJSON</b> puts the shape on your clipboard.</li></ol>
  <div class="tip">You can also start from an official outline: Identify it, then tap <b>EDIT AS SKETCH</b>. Large outlines are simplified a little, and only the biggest piece is kept.</div>

  <h3 id="h-pin">Pin check (is it inside the park?)</h3>
  <ul><li>Get a pin in one of three ways: tap a pink POTA pin, use <kbd>PIN</kbd> and tap the map, or right-click / long-press anywhere. A dropped pin can be dragged.</li>
  <li>In the pin’s pop-up, tap <b>CHECK PIN VS BOUNDARIES</b>. For each switched-on outline within 5 miles, you get <span class="in">INSIDE</span> or <span class="out">OUTSIDE</span> and the distance to its edge. Dashed lines on the map show the nearest edge.</li>
  <li>The pop-up also has Directions, Street View, the POTA page and Copy GPS.</li></ul>

  <h3 id="h-search">Search & links</h3>
  <ul><li>The search box takes Kentucky POTA refs or park names. A bare number like <b>10172</b> becomes US-10172.</li>
  <li>To share a park, add <code>?ref=US-10172</code> to the end of this page’s address.</li></ul>

  <h3 id="h-updates">Updates (new or changed layers)</h3>
  <ul><li>Tap <kbd>UPDATES</kbd> in the top bar. A red number on it means something changed since you last looked.</li>
  <li><b>Your layers</b> shows whether each server answered, how many shapes it has in Kentucky (and what it had last time), and when it was last edited, if the server says. <span class="badge b-chg">CHANGED</span> marks a layer that changed since your last check.</li>
  <li><b>New on the Kentucky GIS server</b> lists services the state added since your last check. <span class="badge b-rel">PARK / LAND?</span> marks names that look like public land.</li>
  <li><b>SHOW LAYERS</b> → <b>ADD TO MAP</b> tries a new layer right away, for this visit only. To keep it for everyone, tap <b>COPY CATALOG ENTRY</b> and paste it into <code>ky-gis-layers.json</code> in the repo.</li>
  <li>The very first check only records a starting point. Changes show from the second check on. A quiet check also runs by itself when the last one is more than a week old.</li>
  <li>The live Kentucky, NPS, FWS and USFS layers are always current on the map anyway. Updates is mostly for spotting <i>new</i> layers and big changes.</li></ul>

  <h3 id="h-phone">On a phone</h3>
  <ul><li>The Layers and Results panels open from the bottom. Close one with the × to see more map.</li>
  <li>Long-press the map to drop a pin. Pinch to zoom.</li>
  <li>Downloads (GeoJSON/KML) go to your phone’s Files or Downloads.</li></ul>

  <h3 id="h-rules">Good to know</h3>
  <ul><li><b>Research helper, not official.</b> Always confirm on the agency’s own pages and maps before a POTA submission.</li>
  <li>PAD-US is a snapshot and can miss new land. Blackford Oaks WMA was on the live KDFWR layer before PAD-US had it.</li>
  <li>Outlines here come from official sources only. OpenStreetMap is used for the street background, never as a boundary. The club’s OSM-traced file is dashed and marked “not evidence”.</li>
  <li>Parcels are approximate, and owner names are hidden.</li>
  <li>This page is unlisted, not private. Anyone with the link can open it.</li></ul>
  <p style="margin-top:16px"><button class="btn2 g" data-close-m>CLOSE</button> <button class="btn2" data-show-about>SOURCES & CREDITS</button></p>`;
  $('#modal').style.display = 'flex';
  const box = $('#modalB'); box.scrollTop = 0;
  if (section) { const t = box.querySelector('#h-' + section); if (t) box.scrollTop = t.offsetTop - 10; }
}
$('#modalB').addEventListener('click', e => {
  const j = e.target.closest('[data-jump]'); if (j) { e.preventDefault(); const t = $('#modalB').querySelector('#h-' + j.dataset.jump); if (t) $('#modalB').scrollTop = t.offsetTop - 10; return; }
  if (e.target.closest('[data-close-m]')) { $('#modal').style.display = 'none'; return; }
  if (e.target.closest('[data-show-about]')) about();
});
if (location.hash === '#help') setTimeout(() => help(), 300);
window.addEventListener('hashchange', () => { if (location.hash === '#help') help(); });
try { if (!localStorage.getItem('kygis_seen_help')) { localStorage.setItem('kygis_seen_help', '1'); setTimeout(() => toast('New here? Tap ? HELP at the top for a quick how-to.', 6000), 1500); } } catch (e) {}

/* ---------- boot ---------- */
fetch(LAYERS_URL).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(cat => {
  cat.layers = (cat.layers || []).filter(l => l.group !== 'basemap' && l.group !== 'banned' && !isBanned(l.rest_url) && !isBanned(l.query_url));
  CAT = cat; buildPanel(); loadPota(); updateCredits(); updateDot();
  if (!UPD || Date.now() - UPD.result.when > 7 * 864e5) setTimeout(() => runUpdateCheck(true), 5000);
}).catch(e => { $('#layerList').innerHTML = `<p class="warn">Could not load ${LAYERS_URL} (${esc(e.message)}). It must sit in the same folder as this page.</p>`; });
window.KYGIS = {runUpdateCheck, renderUpdates, help, get UPD() { return UPD; }, map, LY, POTA, setMode, gotoRef, checkPin, sketch, setPin, identify, acresOf};   /* for testing in the console */
})();
</script>
